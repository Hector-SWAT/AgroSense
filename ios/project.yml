# Alternativa: generar el proyecto con XcodeGen (brew install xcodegen && xcodegen)
name: AgroSense
options:
  bundleIdPrefix: com.swat
  deploymentTarget:
    iOS: "17.0"
targets:
  AgroSense:
    type: application
    platform: iOS
    sources: [AgroSense]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swat.agrosense
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgroSense
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
