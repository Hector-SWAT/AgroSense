name: Compilar AgroSense (APK + IPA)

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AgroSense-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar app iOS sin firmar
        run: |
          xcodebuild -project ios/AgroSense.xcodeproj -target AgroSense -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empaquetar IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/AgroSense.app Payload/
          zip -qr AgroSense-sin-firmar.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AgroSense-ios-ipa
          path: AgroSense-sin-firmar.ipa
